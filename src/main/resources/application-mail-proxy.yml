# Opt in with SPRING_PROFILES_ACTIVE=production,mail-proxy.
# JavaMail SMTP uses its own HTTP CONNECT proxy, independently of HTTP_PROXY.
# This route uses Gmail port 465, which requires TLS from the start of the connection.
spring:
  mail:
    properties:
      mail.smtp.proxy.host: ${MAIL_PROXY_HOST}
      mail.smtp.proxy.port: ${MAIL_PROXY_PORT:7890}
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false
