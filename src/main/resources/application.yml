server:
  port: 8080
  error:
    include-message: always
  servlet:
    context-path: /api

spring:
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  config:
    import: optional:file:.env[.properties],optional:file:backend-java/.env[.properties]
  application:
    name: ai-app-backend
  mvc:
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:180000}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:6MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:6MB}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:aiapp}
    password: ${MYSQL_PASSWORD:aiapp}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-token: ${AI_SERVICE_INTERNAL_TOKEN:}
    max-in-memory-size: ${AI_SERVICE_MAX_IN_MEMORY_SIZE:4194304}
    connect-timeout-millis: ${AI_SERVICE_CONNECT_TIMEOUT_MILLIS:5000}
    response-timeout-seconds: ${AI_SERVICE_RESPONSE_TIMEOUT_SECONDS:120}

app:
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  v63:
    auth-login-enabled: ${AUTH_LOGIN_V63_ENABLED:true}
    workspace-drop-enabled: ${CHAT_WORKSPACE_DROP_ENABLED:true}
    folder-attachments-enabled: ${CHAT_FOLDER_ATTACHMENTS_ENABLED:true}
  auth:
    jwt-secret: ${JWT_SECRET:lyle-dev-secret-key-please-change-to-at-least-32-bytes}
    jwt-key-id: ${JWT_KEY_ID:v64-current}
    jwt-previous-secret: ${JWT_PREVIOUS_SECRET:}
    jwt-previous-key-id: ${JWT_PREVIOUS_KEY_ID:}
    accept-legacy-jwt: ${AUTH_ACCEPT_LEGACY_JWT:false}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:15}
    refresh-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
    issuer: ${JWT_ISSUER:lyle-ai}
    audience: ${JWT_AUDIENCE:lyle-web}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:lyle_refresh}
    secure-cookie: ${REFRESH_COOKIE_SECURE:false}
    session-v64-enabled: ${AUTH_SESSION_V64_ENABLED:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4174,http://localhost:4174,http://127.0.0.1:4176,http://localhost:4176}
  usage:
    ledger-enabled: ${AI_USAGE_LEDGER_ENABLED:true}
    quota-enforcement-enabled: ${AI_USAGE_QUOTA_ENFORCEMENT_ENABLED:false}
    user-view-enabled: ${AI_USAGE_USER_VIEW_ENABLED:true}
    internal-token: ${AI_USAGE_INTERNAL_TOKEN:lyle-dev-usage-token-change-me}
    reservation-ttl-minutes: ${AI_USAGE_RESERVATION_TTL_MINUTES:10}
  billing:
    catalog-enabled: ${BILLING_CATALOG_ENABLED:true}
    ledger-enabled: ${COMMERCIAL_LEDGER_ENABLED:true}
    settlement-shadow-enabled: ${COMMERCIAL_SETTLEMENT_SHADOW_ENABLED:true}
    quota-enforcement-enabled: ${COMMERCIAL_QUOTA_ENFORCEMENT_ENABLED:false}
    checkout-enabled: ${PAYMENT_CHECKOUT_ENABLED:false}
    webhook-enabled: ${PAYMENT_WEBHOOK_ENABLED:true}
    fulfillment-worker-enabled: ${PAYMENT_FULFILLMENT_WORKER_ENABLED:true}
    reconciliation-enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    user-view-enabled: ${BILLING_USER_VIEW_ENABLED:true}
    market: ${BILLING_MARKET:CN}
    currency: ${BILLING_CURRENCY:CNY}
    payment-provider: ${PAYMENT_PROVIDER:MOCK}
    merchant-id: ${PAYMENT_MERCHANT_ID:lyle-local-sandbox}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:8080/api/billing/webhooks/mock}
    alipay:
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      app-id: ${ALIPAY_APP_ID:}
      app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      seller-id: ${ALIPAY_SELLER_ID:}
      seller-email: ${ALIPAY_SELLER_EMAIL:}
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url-base: ${ALIPAY_RETURN_URL_BASE:http://localhost:5173/billing/result}
    wechat-pay:
      app-id: ${WECHAT_PAY_APP_ID:}
      merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      merchant-private-key-path: ${WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      wechat-pay-public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
      wechat-pay-public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    order-ttl-minutes: ${BILLING_ORDER_TTL_MINUTES:30}
    reservation-ttl-minutes: ${COMMERCIAL_RESERVATION_TTL_MINUTES:10}
    reservation-credit-micros: ${COMMERCIAL_RESERVATION_CREDIT_MICROS:1000000}
    free-credit-micros: ${COMMERCIAL_FREE_CREDIT_MICROS:100000000}
    fulfillment-scan-millis: ${PAYMENT_FULFILLMENT_SCAN_MILLIS:2000}
    settlement-scan-millis: ${COMMERCIAL_SETTLEMENT_SCAN_MILLIS:10000}
    maintenance-scan-millis: ${BILLING_MAINTENANCE_SCAN_MILLIS:60000}
  redis:
    enabled: ${REDIS_ENABLED:false}
  minio:
    enabled: ${MINIO_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:knowledge-files}
  qdrant:
    enabled: ${QDRANT_ENABLED:false}
    endpoint: ${QDRANT_ENDPOINT:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
  tos:
    enabled: ${TOS_ENABLED:true}
    endpoint: ${TOS_ENDPOINT:tos-cn-shanghai.volces.com}
    region: ${TOS_REGION:cn-shanghai}
    access-key-id: ${TOS_ACCESS_KEY_ID:}
    secret-access-key: ${TOS_SECRET_ACCESS_KEY:}
    bucket: ${TOS_BUCKET:common-prod-object}
    save-path-head: ${TOS_SAVE_PATH_HEAD:zl-dev/}
    public-url-head: ${TOS_PUBLIC_URL_HEAD:https://common-prod-object.tos-cn-shanghai.volces.com/}
  rate-limit:
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    chat-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:60}
    login-username-per-minute: ${AUTH_LOGIN_USERNAME_RATE_LIMIT_PER_MINUTE:10}
    register-per-minute: ${AUTH_REGISTER_RATE_LIMIT_PER_MINUTE:8}
    refresh-per-minute: ${AUTH_REFRESH_RATE_LIMIT_PER_MINUTE:30}
    password-per-minute: ${AUTH_PASSWORD_RATE_LIMIT_PER_MINUTE:6}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
  mission:
    enabled: ${MISSION_ENABLED:false}
    execution-enabled: ${MISSION_EXECUTION_ENABLED:false}
    r1-enabled: ${MISSION_R1_ENABLED:false}
    shadow-only: ${MISSION_SHADOW_ONLY:false}
    enabled-users: ${MISSION_ENABLED_USERS:}
    enabled-templates: ${MISSION_ENABLED_TEMPLATES:project-health,research-weekly,release-readiness}
    enabled-r1-tools: ${MISSION_ENABLED_R1_TOOLS:todo.propose,file.patch.propose}
    scheduler-scan-millis: ${MISSION_SCHEDULER_SCAN_MILLIS:15000}
  agent-task:
    max-parallel-read-branches: ${AGENT_TASK_MAX_PARALLEL_READ_BRANCHES:3}
