<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lyle AI 邮箱验证</title></head>
<body style="margin:0;padding:0;background-color:#f5f5fa;color:#172033;font-family:Arial,'Microsoft YaHei',sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">完成{{action}}验证，继续使用 Lyle AI。验证码 5 分钟内有效。</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5fa;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border:1px solid #e6e7ef;border-radius:16px;">
        <tr><td style="padding:28px 28px 22px;border-bottom:1px solid #eeeeF5;">
          <p style="margin:0;color:#4f46e5;font-size:24px;font-weight:bold;letter-spacing:-0.5px;">Lyle AI</p>
          <p style="margin:8px 0 0;color:#778197;font-size:13px;line-height:1.6;">让想法，继续向前。</p>
        </td></tr>
        <tr><td style="padding:28px;">
          <h1 style="margin:0 0 12px;font-size:23px;line-height:1.4;color:#172033;">{{title}}</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.8;color:#64748b;">{{description}}</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0efff;border:1px solid #e2dfff;border-radius:12px;">
            <tr><td align="center" style="padding:20px 8px 8px;color:#68618f;font-size:12px;">你的邮箱验证码</td></tr>
            <tr><td align="center" style="padding:0 8px 20px;font-family:Consolas,'Courier New',monospace;font-size:34px;line-height:1.4;font-weight:bold;letter-spacing:5px;color:#4f46e5;white-space:nowrap;">{{code}}</td></tr>
          </table>
          <p style="margin:16px 0 26px;text-align:center;font-size:13px;line-height:1.6;color:#64748b;"><strong style="color:#4f46e5;">5 分钟内有效</strong> · 仅可使用一次</p>
          <p style="margin:0;padding-top:20px;border-top:1px solid #eeeef5;font-size:13px;line-height:1.8;color:#64748b;">请勿将验证码透露给他人，Lyle AI 不会向你索取验证码。<br>如果这不是你本人的操作，请忽略此邮件。</p>
        </td></tr>
      </table>
      <p style="margin:20px 0 0;color:#8b93a5;font-size:12px;line-height:1.8;">此邮件由系统自动发送，请勿直接回复。<br>Lyle AI · 账号安全</p>
    </td></tr>
  </table>
</body>
</html>
